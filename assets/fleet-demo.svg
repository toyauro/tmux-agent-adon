<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="562" viewBox="0 0 1120 562" role="img" aria-labelledby="title desc">
  <title id="title">Independent tmux agent workbenches</title>
  <desc id="desc">Illustration of four equal panels. Phone use is working, review is waiting, dev is blocked, and agent 4 is idle. Each panel has green, yellow, red, and grey lights; its current light is highlighted.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#19243d"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="1120" height="562" rx="22" fill="#0d1424"/>
  <rect x="1" y="1" width="1118" height="560" rx="21" fill="none" stroke="#34415d" stroke-width="2"/>
  <path d="M1 49h1118" stroke="#34415d" stroke-width="2"/>
  <circle cx="29" cy="25" r="5" fill="#f38ba8"/>
  <circle cx="47" cy="25" r="5" fill="#f9e2af"/>
  <circle cx="65" cy="25" r="5" fill="#a6e3a1"/>
  <text x="91" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#a6b4d1">tmux · agent workbenches</text>
  <text x="1089" y="30" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#7383a2">ILLUSTRATION</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <!-- Phone: working -->
    <g transform="translate(20 70)">
      <rect width="530" height="215" rx="12" fill="url(#surface)" stroke="#394967"/>
      <path d="M1 42h528" stroke="#394967"/>
      <circle cx="22" cy="21" r="4" fill="#89b4fa"/>
      <text x="35" y="26" font-size="16" font-weight="600" fill="#d9e4ff">phone use</text>
      <rect x="360" y="8" width="125" height="27" rx="13.5" fill="#111827" stroke="#536687"/>
      <circle cx="378" cy="21.5" r="6" fill="#38ff69"/>
      <circle cx="406" cy="21.5" r="6" fill="#725d20"/>
      <circle cx="434" cy="21.5" r="6" fill="#773344"/>
      <circle cx="462" cy="21.5" r="6" fill="#585b70"/>
      <text x="503" y="27" font-size="18" fill="#9caecb">+</text>
      <text x="22" y="79" font-size="14" fill="#86a0c4">$ phone-agent ui dump</text>
      <text x="22" y="113" font-size="16" fill="#d9e4ff">Checking the phone</text>
      <circle cx="26" cy="177" r="4" fill="#38ff69"/>
      <text x="39" y="182" font-size="13" fill="#97a9c8">WORKING</text>
    </g>

    <!-- Review: waiting -->
    <g transform="translate(570 70)">
      <rect width="530" height="215" rx="12" fill="url(#surface)" stroke="#394967"/>
      <path d="M1 42h528" stroke="#394967"/>
      <circle cx="22" cy="21" r="4" fill="#cba6f7"/>
      <text x="35" y="26" font-size="16" font-weight="600" fill="#d9e4ff">review</text>
      <rect x="360" y="8" width="125" height="27" rx="13.5" fill="#111827" stroke="#536687"/>
      <circle cx="378" cy="21.5" r="6" fill="#285c37"/>
      <circle cx="406" cy="21.5" r="6" fill="#ffe347"/>
      <circle cx="434" cy="21.5" r="6" fill="#773344"/>
      <circle cx="462" cy="21.5" r="6" fill="#585b70"/>
      <text x="503" y="27" font-size="18" fill="#9caecb">+</text>
      <text x="22" y="79" font-size="14" fill="#86a0c4">$ review changes</text>
      <text x="22" y="113" font-size="16" fill="#d9e4ff">Waiting for a response</text>
      <circle cx="26" cy="177" r="4" fill="#ffe347"/>
      <text x="39" y="182" font-size="13" fill="#97a9c8">WAITING</text>
    </g>

    <!-- Dev: blocked -->
    <g transform="translate(20 300)">
      <rect width="530" height="215" rx="12" fill="url(#surface)" stroke="#394967"/>
      <path d="M1 42h528" stroke="#394967"/>
      <circle cx="22" cy="21" r="4" fill="#f5c2e7"/>
      <text x="35" y="26" font-size="16" font-weight="600" fill="#d9e4ff">dev</text>
      <rect x="360" y="8" width="125" height="27" rx="13.5" fill="#111827" stroke="#536687"/>
      <circle cx="378" cy="21.5" r="6" fill="#285c37"/>
      <circle cx="406" cy="21.5" r="6" fill="#725d20"/>
      <circle cx="434" cy="21.5" r="6" fill="#ff6b78"/>
      <circle cx="462" cy="21.5" r="6" fill="#585b70"/>
      <text x="503" y="27" font-size="18" fill="#9caecb">+</text>
      <text x="22" y="79" font-size="14" fill="#86a0c4">$ run checks</text>
      <text x="22" y="113" font-size="16" fill="#d9e4ff">Unable to proceed</text>
      <circle cx="26" cy="177" r="4" fill="#ff6b78"/>
      <text x="39" y="182" font-size="13" fill="#97a9c8">BLOCKED</text>
    </g>

    <!-- Agent: idle -->
    <g transform="translate(570 300)">
      <rect width="530" height="215" rx="12" fill="url(#surface)" stroke="#394967"/>
      <path d="M1 42h528" stroke="#394967"/>
      <circle cx="22" cy="21" r="4" fill="#94e2d5"/>
      <text x="35" y="26" font-size="16" font-weight="600" fill="#d9e4ff">agent-4</text>
      <rect x="360" y="8" width="125" height="27" rx="13.5" fill="#111827" stroke="#536687"/>
      <circle cx="378" cy="21.5" r="6" fill="#285c37"/>
      <circle cx="406" cy="21.5" r="6" fill="#725d20"/>
      <circle cx="434" cy="21.5" r="6" fill="#773344"/>
      <circle cx="462" cy="21.5" r="6" fill="#dff5ff"/>
      <text x="503" y="27" font-size="18" fill="#9caecb">+</text>
      <text x="22" y="79" font-size="14" fill="#86a0c4">$ _</text>
      <text x="22" y="113" font-size="16" fill="#d9e4ff">Ready for the next task</text>
      <circle cx="26" cy="177" r="4" fill="#dff5ff"/>
      <text x="39" y="182" font-size="13" fill="#97a9c8">IDLE</text>
    </g>
  </g>
  <text x="31" y="544" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#7183a1">Independent panels · Names and responsibilities can change</text>
</svg>
